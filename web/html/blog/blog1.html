<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phố Cổ Hội An - MyMiniCloud Travel Blog</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap");

      :root {
        --primary: #1d5564;
        --primary-light: #2c7487;
        --accent: #d85a38;
        --bg: #f4f8fa;
        --surface: #ffffff;
        --text-main: #243338;
        --text-muted: #647b83;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.6;
        padding-bottom: 60px;
      }
      .top-nav-capsule {
        display: flex;
        justify-content: center;
        padding: 24px 16px;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .capsule-bar {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(29, 85, 100, 0.15);
        border-radius: 999px;
        padding: 6px 14px;
        display: flex;
        gap: 8px;
        box-shadow: 0 8px 24px rgba(29, 85, 100, 0.08);
        flex-wrap: wrap;
        justify-content: center;
      }
      .capsule-item {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 999px;
        transition: all 0.25s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .capsule-item:hover,
      .capsule-item.active {
        background: var(--primary);
        color: #fff;
      }
      .capsule-item.back-home {
        background: #e2edf0;
        color: var(--primary);
      }

      .container {
        max-width: 1060px;
        margin: 0 auto;
        padding: 0 20px;
      }

      h1,
      h2,
      h3,
      .heading-condensed {
        font-family: "Oswald", sans-serif;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .article-wrap {
        background: #ffffff;
        border-radius: 20px;
        padding: 40px;
        margin-top: 10px;
        box-shadow: 0 10px 30px rgba(29, 85, 100, 0.08);
        border: 1px solid #e1ecf0;
      }
      .article-header {
        text-align: center;
        margin-bottom: 30px;
      }
      .article-number {
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 2px;
        margin-bottom: 8px;
      }
      .article-title {
        font-size: clamp(34px, 5vw, 52px);
        line-height: 1.1;
        margin-bottom: 12px;
      }
      .article-subtitle {
        color: var(--text-muted);
        font-size: 16px;
        max-width: 650px;
        margin: 0 auto;
      }
      .stamp-hero {
        max-width: 820px;
        margin: 30px auto;
        height: 420px;
        background: #f0f5f7;
        border: 10px solid #fcfdfe;
        outline: 3px dashed #adc7ce;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.1);
      }
      .stamp-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .content-body {
        max-width: 760px;
        margin: 0 auto;
        font-size: 17px;
        color: #33484f;
        line-height: 1.8;
      }
      .lead-box {
        background: #eef6f8;
        border-left: 4px solid var(--primary);
        padding: 18px 24px;
        border-radius: 0 12px 12px 0;
        margin-bottom: 24px;
        font-weight: 500;
        color: var(--primary);
      }
      .nav-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 50px;
        padding-top: 24px;
        border-top: 1px solid #e1ecf0;
        flex-wrap: wrap;
        gap: 16px;
      }
      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        padding: 10px 20px;
        background: #f0f6f8;
        border-radius: 999px;
        transition: all 0.2s;
      }
      .nav-btn:hover {
        background: var(--primary);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="top-nav-capsule">
      <nav class="capsule-bar">
        <a href="../index.html" class="capsule-item back-home">← Trang chủ</a>
        <a href="index.html" class="capsule-item">Danh mục Blog</a>
        <a href="blog1.html" class="capsule-item active">01. HỘI AN</a>
        <a href="blog2.html" class="capsule-item">02. HUẾ</a>
        <a href="blog3.html" class="capsule-item">03. THĂNG LONG</a>
      </nav>
    </div>

    <div class="container">
      <article class="article-wrap">
        <div class="article-header">
          <div class="article-number">DI SẢN VĂN HÓA VẬT THỂ #01</div>
          <h1 class="heading-condensed article-title">Phố Cổ Hội An</h1>
          <p class="article-subtitle">
            Không gian kiến trúc truyền thống Đông Nam Á lưu giữ vẹn nguyên qua
            nhiều thế kỷ
          </p>
        </div>

        <div class="stamp-hero">
          <img src="images/hoian.JPG" alt="Phố Cổ Hội An" />
        </div>

        <div class="content-body">
          <div class="lead-box">
            Hội An được UNESCO công nhận là Di sản Văn hóa Thế giới từ năm 19
          </div>
        </div>
      </article>
    </div>
  </body>
</html>
