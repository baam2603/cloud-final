server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Backend-Server "web-frontend-server2" always;

    location = /lb-test {
        default_type text/plain;
        return 200 "Web Server 2";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
