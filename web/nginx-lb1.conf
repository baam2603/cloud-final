server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Backend-Server "web-frontend-server1" always;

    location = /lb-test {
        default_type text/plain;
        return 200 "Web Server 1\n";
    }

    location ^~ /blog/ {
        alias /usr/share/nginx/html/blog/;
        index index.html;
        autoindex off;
    }

    location = /metrics {
        default_type text/plain;
        access_log off;
        return 200 "nginx_up 1\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}