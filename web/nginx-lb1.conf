server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Backend-Server "web-frontend-server1" always;

    # Different responses enable easy round-robin proof without
    # modifying the existing HTML pages and blog assets.
    location = /lb-test {
        default_type text/plain;
        return 200 "Web Server 1";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
