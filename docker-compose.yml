networks:
  cloud-net:
    name: cloud-net

volumes:
  db_data:

services:
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports: ["8081:8080"]
    restart: unless-stopped
    networks: [cloud-net]

  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports: ["1053:53/udp"]
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/db.cloud.local:/etc/bind/db.cloud.local:ro
    restart: unless-stopped
    networks: [cloud-net]

  web-frontend-server:
    build: ./web
    image: minicloud-web:dev
    container_name: web-frontend-server
    networks:
      - cloud-net
    ports:
      - "8080:80"
    restart: unless-stopped

  application-backend-server:
    build: ./app
    image: tv2/app:dev
    container_name: application-backend-server
    ports: ["8085:8081"]
    environment:
      OIDC_ISSUER: "http://authentication-identity-server:8080/realms/master"
      OIDC_AUDIENCE: "myapp"
    depends_on: [relational-database-server]
    networks: [cloud-net]
    restart: unless-stopped

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql
    ports: ["3306:3306"]
    networks: [cloud-net]
    restart: unless-stopped

  object-storage-server:
    build: ./storage
    image: tv2/minio:dev
    container_name: object-storage-server
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage/data:/data
    ports: ["9000:9000", "9001:9001"]
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports: ["9100:9100"]
    networks: [cloud-net]

  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    ports: ["9090:9090"]
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [cloud-net]

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports: ["3000:3000"]
    networks: [cloud-net]

  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    depends_on:
      - web-frontend-server
    ports:
      - "80:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cloud-net
    restart: unless-stopped